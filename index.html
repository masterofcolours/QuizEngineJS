<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #515151;
            color: #333;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* هدر آزمون: شماره سوال و تایمر */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }

        .index-box {
            font-size: 0.95rem;
            font-weight: 600;
            color: #555;
            background: #eef2ff;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: 700;
            color: #d97706;
            background: #fffbe0;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #fef3c7;
            letter-spacing: 1px;
        }

        /* سوال */
        .prompt-box {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            color: #1f2937;
        }

        /* گزینه‌ها */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-item:hover {
            border-color: #3b82f6;
            background-color: #f8fafc;
        }

        .option-input {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .option-label {
            font-size: 1rem;
            color: #374151;
            cursor: pointer;
            width: 100%;
        }

        /* دکمه‌های ناوبری و اکشن‌ها */
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding-top: 16px;
            border-top: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #d1d5db;
        }

        .btn-success {
            background-color: #10b981;
            color: #ffffff;
        }

        .btn-success:hover:not(:disabled) {
            background-color: #059669;
        }

        .btn-danger {
            background-color: #ef4444;
            color: #ffffff;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #dc2626;
        }

        .result-item{
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    
    </style>
</head>
<body>

    <main class="quiz-card">
        <header class="quiz-header">
            <div id="index" class="index-box">0 - 0</div>
            <div id="timer" class="timer-box">00:00:00</div>
        </header>

        <section id="prompt" class="prompt-box">
            در حال بارگذاری سوال...
        </section>

        <section class="options-group">
            <label class="option-item">
                <input type="radio" name="quiz-option" class="option-input" value="a">
                <span class="option-label">گزینه اول</span>
            </label>

            <label class="option-item">
                <input type="radio" name="quiz-option" class="option-input" value="b">
                <span class="option-label">گزینه دوم</span>
            </label>

            <label class="option-item">
                <input type="radio" name="quiz-option" class="option-input" value="c">
                <span class="option-label">گزینه سوم</span>
            </label>

            <label class="option-item">
                <input type="radio" name="quiz-option" class="option-input" value="d">
                <span class="option-label">گزینه چهارم</span>
            </label>
        </section>

        <footer class="quiz-footer">
            <div class="nav-buttons">
                <button id="next-btn" class="btn btn-secondary">Next</button>
                <button id="prev-btn" class="btn btn-secondary">Previous</button>
            </div>

            <div class="action-buttons">
                <button id="select-btn" class="btn btn-primary">Submit response</button>
                <button id="end-btn" class="btn btn-danger">End and Exit</button>
            </div>
        </footer>
    </main>

    <main class="result-box quiz-card">
        <h2> Result </h2>
    </main>

    <script src="./main.js" type="module"></script>
</body>
</html>
